<form class="formulario-contato">
    <div class="campo-formulario">
        <label>Nome:</label>
        <input type="text" id="nome" name="nome" required placeholder="Digite seu nome completo">
    </div>

    <div class="campo-formulario">
        <label>E-mail:</label>
        <input type="email" id="email" name="email" required placeholder="seu@email.com">
    </div>

    <div class="campo-formulario">
        <label>O que busca:</label>
        <textarea id="mensagem" name="mensagem" maxlength="2000"required placeholder="Descreva o que você busca"></textarea>
        <p class="tamanho-maximo">*Máximo de 2000 caracteres</p>
    </div>

    <button type="submit" onclick="exibirMensagemSucesso()">Enviar mensagem</button>
</form>
<div class="mensagem-sucesso" style="display: none;">Mensagem enviada com sucesso!</div>
